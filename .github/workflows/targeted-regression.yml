name: Targeted Regression Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run targeted regression tests
        run: npm run test:targeted
